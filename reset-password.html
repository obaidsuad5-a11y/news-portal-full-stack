<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>পাসওয়ার্ড রিসেট | আমার বাংলাদেশ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #087653; --bg: #f3f7f5; --surface: #ffffff; --text: #172720; --line: #e1eae5; }
    body { font-family: "Hind Siliguri", sans-serif; background: var(--bg); color: var(--text); margin: 0; display: grid; place-items: center; min-height: 100vh; }
    .card { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid var(--line); width: min(400px, 90%); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: var(--green); }
    input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid var(--line); border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .msg { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>নতুন পাসওয়ার্ড সেট করুন</h2>
    <form id="resetForm">
      <label>নতুন পাসওয়ার্ড (নূন্যতম ১০ অক্ষর)</label>
      <input type="password" id="newPassword" required minlength="10">
      <button type="submit">পাসওয়ার্ড পরিবর্তন করুন</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message;
          setTimeout(() => window.location.href = '/admin.html', 2000);
        } else {
          msg.style.color = 'red';
          msg.textContent = data.message;
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'পাসওয়ার্ড রিসেট করতে ব্যর্থ হয়েছে।';
      }
    });
  </script>
</body>
</html>
